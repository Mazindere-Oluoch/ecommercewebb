<div class="container">
    <mat-card>
        <mat-card-title>Sign up</mat-card-title>
        <mat-card-content>
            <form [formGroup]="signUpForm" (ngSubmit)="onsubmit()">

                <mat-form-field appearance="outline">
                    <mat-label>Name</mat-label>
                    <input type="text" matInput formControlName="name" placeholder="min 4 characters" required>

                    <!-- @if (signUpForm.get('name')?.invalid && signUpForm.get('name')?.touched) {
                    <mat-error>Please enter a valid name</mat-error>
                    } -->

                </mat-form-field>


                <mat-form-field appearance="outline">
                    <mat-label>E-mail</mat-label>
                    <input matInput formControlName="email" placeholder="Email" required>

                    <!-- @if (signUpForm.get('email')?.invalid && signUpForm.get('email')?.touched) {
                    <mat-error>Please enter a valid Email</mat-error>
                    } -->
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                        placeholder="Password min 4 characters" required>

                    <button mat-icon-button matSuffix (click)="togglePasswordVisiblity()">
                        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>

                    <!-- @if (signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched) {
                    <mat-error>Please enter a valid password</mat-error>
                    } -->
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Confirm Password</mat-label>
                    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword"
                        placeholder="ConfirmPassword" required>

                    <button mat-icon-button matSuffix (click)="togglePasswordVisiblity()">
                        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                    </button>

                    <!-- @if (signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched) {
                    <mat-error>Please enter a valid password</mat-error>
                    } -->
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="signUpForm.invalid">Sign Up</button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
